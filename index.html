<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Kiddle</title>
  <link rel="icon" href="assets/images/elephantOrange.png" type="image/png" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="logo">
        <img src="assets/images/elephantOrange.png" alt="Kiddle elephant" />
      </div>
      <h1>Kiddle</h1>
      <div class="timer" id="timer">10</div>
    </header>

    <main class="main">
      <div class="tiles" id="tiles"></div>

      <div class="status" id="status">Tap Start to play</div>

      <button class="btn primary" id="startBtn">Start</button>
    </main>

    <div class="keyboard" id="keyboard"></div>

    <footer class="footer">
      <div class="stats">
        <div class="stat"><span id="wins">0</span> wins</div>
        <div class="stat"><span id="losses">0</span> losses</div>
      </div>
      <div class="actions">
        <button class="btn" id="resetBtn">Reset</button>
        <button class="btn" id="helpBtn">?</button>
      </div>
    </footer>

    <div class="modal" id="modal">
      <div class="modal-content">
        <h2>How to play</h2>
        <p>Guess the 4-letter word before the timer runs out.</p>
        <p>Tap letters on the keyboard (or use your physical keyboard). Correct letters fill in.</p>
        <p>Win by filling all tiles. Lose if time hits zero.</p>
        <button class="btn primary" id="closeModal">Got it</button>
      </div>
    </div>
  </div>

  <script src="assets/scripts/script.js"></script>
</body>
</html>
